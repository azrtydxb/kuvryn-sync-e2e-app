# Kuvryn Sync e2e fixture: wave 0 workload.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuvryn-sync-e2e-api
  namespace: kuvryn-sync-e2e-staged
  annotations:
    sync.kuvryn.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kuvryn-sync-e2e-api
  template:
    metadata:
      labels:
        app: kuvryn-sync-e2e-api
    spec:
      containers:
        - name: api
          image: registry.k8s.io/pause:3.10
