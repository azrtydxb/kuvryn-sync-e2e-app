# Kuvryn Sync e2e fixture: a post-sync hook that runs after every wave is Healthy.
apiVersion: batch/v1
kind: Job
metadata:
  name: kuvryn-sync-e2e-smoke
  namespace: kuvryn-sync-e2e-staged
  annotations:
    sync.kuvryn.io/hook: post-sync
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: smoke
          image: busybox:1.36
          command: ["sh", "-c", "echo smoke test"]
